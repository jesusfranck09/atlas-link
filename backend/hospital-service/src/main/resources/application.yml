server:
  address: 127.0.0.1
  port: ${PORT:8097}
  error:
    include-message: never
    include-stacktrace: never
  tomcat:
    max-http-form-post-size: 3MB
spring:
  application:
    name: atlas-link
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5440/atlas_link}
    username: ${DB_USER:atlas_hospital}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 8
      connection-timeout: 5000
  flyway:
    enabled: ${ATLAS_MIGRATE:true}
    schemas: ${DB_SCHEMA:hospital}
    default-schema: ${DB_SCHEMA:hospital}
    placeholders:
      demoEnabled: ${ATLAS_DEMO_ENABLED:false}
    user: ${FLYWAY_USER:atlas_hospital_owner}
    password: ${FLYWAY_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
      file-size-threshold: 3MB
  jackson:
    deserialization:
      fail-on-unknown-properties: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
atlas:
  demo-enabled: ${ATLAS_DEMO_ENABLED:false}
  identity-url: ${IDENTITY_URL:http://127.0.0.1:8091}
  control-url: ${CONTROL_URL:http://127.0.0.1:8092}
  internal-api-key: ${INTERNAL_API_KEY:}
  session-hours: 8
---
spring:
  config:
    activate:
      on-profile: demo
atlas:
  demo-enabled: true
