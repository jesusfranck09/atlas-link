server:
  address: 127.0.0.1
  port: 8092
  max-http-request-header-size: 16KB
  error:
    include-message: never
spring:
  application:
    name: atlas-control
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 8
      connection-timeout: 5000
  flyway:
    enabled: ${ATLAS_MIGRATE:true}
    url: ${DB_URL}
    user: ${FLYWAY_USER:}
    password: ${FLYWAY_PASSWORD:}
    default-schema: ${DB_SCHEMA:control}
    schemas: ${DB_SCHEMA:control}
    locations: classpath:db/migration
    placeholders:
      demoEnabled: ${ATLAS_DEMO_ENABLED:false}
  jackson:
    deserialization:
      fail-on-unknown-properties: true
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
atlas:
  identity-url: ${IDENTITY_URL:http://127.0.0.1:8091}
  hospital-url: ${HOSPITAL_URL:http://127.0.0.1:8097}
  internal-key: ${INTERNAL_API_KEY}
